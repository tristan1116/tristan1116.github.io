<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600"
     font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="600" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="550" y="46" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">链接第一步之后：表动了，指令还没动</text>

  <!-- ==================== 左：两张表 ==================== -->
  <text x="280" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">段表与符号表（地址已填好）</text>

  <rect x="70" y="115" width="420" height="370" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 段表 -->
  <rect x="90" y="135" width="380" height="120" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="165" font-size="15" font-weight="bold" fill="#475569">段表</text>
  <text x="110" y="198" font-size="13" fill="#334155">.text</text>
  <text x="200" y="198" font-size="13" fill="#334155"><tspan fill="#94a3b8">0</tspan> → 0x140001000</text>
  <text x="110" y="228" font-size="13" fill="#334155">.data</text>
  <text x="200" y="228" font-size="13" fill="#334155"><tspan fill="#94a3b8">0</tspan> → 0x140004000</text>

  <!-- 符号表 -->
  <rect x="90" y="270" width="380" height="195" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="110" y="300" font-size="15" font-weight="bold" fill="#5b21b6">符号表（.symtab）</text>
  <text x="110" y="333" font-size="13" fill="#5b21b6">main</text>
  <text x="230" y="333" font-size="13" fill="#5b21b6"><tspan fill="#94a3b8">0</tspan> → 0x1400016d0</text>
  <text x="110" y="363" font-size="13" fill="#5b21b6">_Z3sumii</text>
  <text x="230" y="363" font-size="13" fill="#5b21b6"><tspan fill="#94a3b8">0</tspan> → 0x140001710</text>
  <text x="110" y="393" font-size="13" fill="#5b21b6">data</text>
  <text x="230" y="393" font-size="13" fill="#5b21b6"><tspan fill="#94a3b8">0</tspan> → 0x140004010</text>
  <text x="110" y="423" font-size="13" fill="#5b21b6">gdata</text>
  <text x="230" y="423" font-size="13" fill="#5b21b6"><tspan fill="#94a3b8">0</tspan> → 0x140004020</text>

  <!-- ==================== 中间箭头 ==================== -->
  <text x="530" y="286" text-anchor="middle" font-size="11.5" fill="#94a3b8">下一步</text>
  <text x="530" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#64748b">重定位</text>
  <line x1="494" y1="330" x2="564" y2="330" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow)"/>

  <!-- ==================== 右：指令 ==================== -->
  <text x="800" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">.text 段里的指令（地址部分还是 0）</text>

  <rect x="570" y="115" width="460" height="370" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="590" y="135" width="420" height="330" rx="6" fill="#dbeafe" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="610" y="170" font-size="14" font-weight="bold" fill="#1e3a5f">main 函数的指令（段内偏移）：</text>

  <text x="610" y="215" font-size="12.5" font-family="Consolas, monospace" xml:space="preserve" fill="#1e3a5f"> 8: e8 <tspan fill="#dc2626">00 00 00 00</tspan>        call __main</text>
  <text x="610" y="253" font-size="12.5" font-family="Consolas, monospace" xml:space="preserve" fill="#1e3a5f"> d: 48 8b 05 <tspan fill="#dc2626">00 00 00 00</tspan>  mov 0x0(%rip),%rax</text>
  <text x="610" y="291" font-size="12.5" font-family="Consolas, monospace" xml:space="preserve" fill="#1e3a5f">19: 8b 05 <tspan fill="#dc2626">00 00 00 00</tspan>     mov 0x0(%rip),%eax</text>
  <text x="610" y="329" font-size="12.5" font-family="Consolas, monospace" xml:space="preserve" fill="#1e3a5f">2a: e8 <tspan fill="#dc2626">00 00 00 00</tspan>        call sum</text>

  <text x="800" y="430" text-anchor="middle" font-size="13" fill="#64748b">4 处地址部分全是 0——等下一步来填</text>

  <!-- 底部说明 -->
  <text x="550" y="545" text-anchor="middle" font-size="13" fill="#666">链接第一步只更新了两张表（段表、符号表）；下一步重定位，才拿表里的地址去改指令里的 0</text>
</svg>
