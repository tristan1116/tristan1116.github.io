<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800"
     font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="800" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="550" y="46" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">可执行文件的结构：各段与加载</text>

  <!-- ==================== 左：磁盘上的文件 ==================== -->
  <text x="270" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a5f">main.exe（磁盘上的文件）</text>

  <rect x="70" y="115" width="400" height="575" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- 文件头 -->
  <rect x="90" y="135" width="360" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="270" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">文件头</text>
  <text x="270" y="189" text-anchor="middle" font-size="12.5" fill="#64748b">程序入口地址 0x140001125</text>

  <!-- program headers -->
  <rect x="90" y="222" width="360" height="72" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="270" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">program headers</text>
  <text x="270" y="276" text-anchor="middle" font-size="12.5" fill="#c2410c">LOAD 项：决定加载哪些段</text>

  <!-- .text -->
  <rect x="90" y="309" width="360" height="78" rx="6" fill="#dbeafe" stroke="#2c5f8a" stroke-width="1.8"/>
  <text x="270" y="339" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">.text</text>
  <text x="270" y="365" text-anchor="middle" font-size="12.5" fill="#1e3a5f">代码　R-X　0x2298 字节</text>

  <!-- .data -->
  <rect x="90" y="402" width="360" height="78" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.8"/>
  <text x="270" y="432" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">.data</text>
  <text x="270" y="458" text-anchor="middle" font-size="12.5" fill="#166534">已初始化数据　RW　0x140 字节</text>

  <!-- .bss -->
  <rect x="90" y="495" width="360" height="78" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="525" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">.bss</text>
  <text x="270" y="551" text-anchor="middle" font-size="12.5" fill="#64748b">未初始化数据　RW　不占文件空间</text>

  <!-- 调试信息 -->
  <rect x="90" y="588" width="360" height="78" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="618" text-anchor="middle" font-size="14" font-weight="bold" fill="#94a3b8">调试信息（.debug_* 等）</text>
  <text x="270" y="644" text-anchor="middle" font-size="12.5" fill="#94a3b8">不加载：运行时用不到</text>

  <!-- ==================== 中间箭头 ==================== -->
  <line x1="482" y1="400" x2="620" y2="400" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="549" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">加载</text>
  <text x="549" y="428" text-anchor="middle" font-size="12" fill="#94a3b8">（按 program headers）</text>

  <!-- ==================== 右：虚拟地址空间 ==================== -->
  <text x="840" y="95" text-anchor="middle" font-size="17" font-weight="bold" fill="#334155">虚拟地址空间（运行时）</text>

  <rect x="640" y="115" width="400" height="575" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="840" y="148" text-anchor="middle" font-size="13" fill="#94a3b8">高地址 ↑</text>

  <!-- .bss -->
  <rect x="660" y="168" width="360" height="100" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="840" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">.bss　RW</text>
  <text x="840" y="238" text-anchor="middle" font-size="12.5" fill="#64748b">0x140009000</text>

  <text x="840" y="302" text-anchor="middle" font-size="13" fill="#cbd5e1">……（其他段）</text>

  <!-- .data -->
  <rect x="660" y="332" width="360" height="100" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.8"/>
  <text x="840" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">.data　RW</text>
  <text x="840" y="402" text-anchor="middle" font-size="12.5" fill="#166534">0x140004000</text>

  <text x="840" y="466" text-anchor="middle" font-size="13" fill="#cbd5e1">……（其他段）</text>

  <!-- .text -->
  <rect x="660" y="496" width="360" height="100" rx="6" fill="#dbeafe" stroke="#2c5f8a" stroke-width="1.8"/>
  <text x="840" y="538" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">.text　R-X</text>
  <text x="840" y="566" text-anchor="middle" font-size="12.5" fill="#1e3a5f">0x140001000</text>

  <text x="840" y="650" text-anchor="middle" font-size="13" fill="#94a3b8">低地址 ↓</text>

  <!-- 底部说明 -->
  <text x="550" y="742" text-anchor="middle" font-size="13" fill="#666">代码段 R-X（可读可执行）、数据段 RW（可读写）；符号表、调试信息这类"给工具用"的内容不加载</text>
</svg>
